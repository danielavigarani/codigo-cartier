<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nebulaGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#67E8F9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="staveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#nebulaGlow)"/>

  <!-- Pentagramas musicais celestes atravessando o observatório -->
  <g fill="none" stroke="url(#staveGold)" stroke-width="1">
    <path d="M 0 360 Q 480 280, 960 360 T 1920 340"/>
    <path d="M 0 376 Q 480 296, 960 376 T 1920 356"/>
    <path d="M 0 392 Q 480 312, 960 392 T 1920 372"/>
    <path d="M 0 408 Q 480 328, 960 408 T 1920 388"/>
    <path d="M 0 424 Q 480 344, 960 424 T 1920 404"/>

    <path d="M 0 720 Q 480 800, 960 720 T 1920 740" stroke-opacity="0.65"/>
    <path d="M 0 736 Q 480 816, 960 736 T 1920 756" stroke-opacity="0.65"/>
    <path d="M 0 752 Q 480 832, 960 752 T 1920 772" stroke-opacity="0.65"/>
    <path d="M 0 768 Q 480 848, 960 768 T 1920 788" stroke-opacity="0.65"/>
    <path d="M 0 784 Q 480 864, 960 784 T 1920 804" stroke-opacity="0.65"/>
  </g>

  <!-- Astrolábio Monumental Central -->
  <g transform="translate(960 460)" fill="none">
    <circle r="480" stroke="url(#ringSilver)" stroke-width="1" stroke-dasharray="3 9" stroke-opacity="0.45"/>
    <circle r="430" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.22"/>
    <circle r="365" stroke="#CBD5E1" stroke-width="0.9" stroke-dasharray="14 6 2 6" stroke-opacity="0.28"/>
    <circle r="290" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.26"/>
    <circle r="210" stroke="#67E8F9" stroke-width="0.8" stroke-dasharray="2 8" stroke-opacity="0.32"/>

    <!-- Órbitas elípticas inclinadas -->
    <ellipse rx="460" ry="175" stroke="#D4AF37" stroke-width="0.9" stroke-opacity="0.24" transform="rotate(-22)"/>
    <ellipse rx="460" ry="175" stroke="#CBD5E1" stroke-width="0.9" stroke-opacity="0.22" transform="rotate(22)"/>
    <ellipse rx="340" ry="120" stroke="#67E8F9" stroke-width="0.8" stroke-opacity="0.2" transform="rotate(64)"/>

    <!-- Eixos cardinais e diagonais -->
    <line x1="-520" y1="0" x2="520" y2="0" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="0" y1="-520" x2="0" y2="520" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="-360" y1="-360" x2="360" y2="360" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.14"/>
    <line x1="-360" y1="360" x2="360" y2="-360" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.14"/>

    <!-- Marcações cardinais nos anéis -->
    <circle cx="0" cy="-430" r="4" fill="#D4AF37" fill-opacity="0.45"/>
    <circle cx="430" cy="0" r="4" fill="#CBD5E1" fill-opacity="0.45"/>
    <circle cx="0" cy="430" r="4" fill="#D4AF37" fill-opacity="0.45"/>
    <circle cx="-430" cy="0" r="4" fill="#CBD5E1" fill-opacity="0.45"/>
  </g>

  <!-- Constelação da Lira / Lua (Esquerda) -->
  <g stroke="#67E8F9" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="4 5" fill="none">
    <polyline points="180,220 265,165 340,240 290,335 205,310 180,220"/>
    <polyline points="115,690 210,635 315,675 275,785 160,815"/>
  </g>

  <!-- Constelação Solar (Direita) -->
  <g stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="4 5" fill="none">
    <polyline points="1540,210 1630,150 1720,205 1685,305 1575,295 1540,210"/>
    <polyline points="1590,695 1690,640 1795,695 1745,810 1625,790"/>
  </g>

