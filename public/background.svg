    <path d="M 265 155 L 267 163 L 275 165 L 267 167 L 265 175 L 263 167 L 255 165 L 263 163 Z" opacity="0.55"/>
    <path d="M 1630 140 L 1632 148 L 1640 150 L 1632 152 L 1630 160 L 1628 152 L 1620 150 L 1628 148 Z" fill="#FDE68A" opacity="0.6"/>
    <path d="M 1390 410 L 1391.5 416 L 1397.5 417.5 L 1391.5 419 L 1390 425 L 1388.5 419 L 1382.5 417.5 L 1388.5 416 Z" opacity="0.45"/>
    <path d="M 520 520 L 521.5 526 L 527.5 527.5 L 521.5 529 L 520 535 L 518.5 529 L 512.5 527.5 L 518.5 526 Z" fill="#67E8F9" opacity="0.45"/>
    <path d="M 1795 685 L 1797 693 L 1805 695 L 1797 697 L 1795 705 L 1793 697 L 1785 695 L 1793 693 Z" fill="#FDE68A" opacity="0.5"/>
    <path d="M 210 625 L 212 633 L 220 635 L 212 637 L 210 645 L 208 637 L 200 635 L 208 633 Z" opacity="0.5"/>

    <circle cx="180" cy="220" r="2.2" opacity="0.45"/>
    <circle cx="340" cy="240" r="2" opacity="0.4"/>
    <circle cx="290" cy="335" r="1.8" opacity="0.35"/>
    <circle cx="205" cy="310" r="1.6" opacity="0.35"/>
    <circle cx="1540" cy="210" r="2.2" fill="#FDE68A" opacity="0.45"/>
    <circle cx="1720" cy="205" r="2" fill="#FDE68A" opacity="0.4"/>
    <circle cx="1685" cy="305" r="1.8" fill="#FDE68A" opacity="0.35"/>
    <circle cx="1575" cy="295" r="1.6" opacity="0.35"/>
    <circle cx="420" cy="145" r="1.4" opacity="0.35"/>
    <circle cx="640" cy="180" r="1.2" opacity="0.3"/>
    <circle cx="1280" cy="165" r="1.3" fill="#FDE68A" opacity="0.35"/>
    <circle cx="1440" cy="120" r="1.5" opacity="0.35"/>
    <circle cx="115" cy="690" r="2" opacity="0.4"/>
    <circle cx="315" cy="675" r="1.8" opacity="0.35"/>
    <circle cx="275" cy="785" r="2.2" opacity="0.4"/>
    <circle cx="160" cy="815" r="1.6" opacity="0.3"/>
    <circle cx="1590" cy="695" r="2" fill="#FDE68A" opacity="0.4"/>
    <circle cx="1690" cy="640" r="2.2" fill="#FDE68A" opacity="0.45"/>
    <circle cx="1745" cy="810" r="1.8" opacity="0.35"/>
    <circle cx="1625" cy="790" r="1.6" opacity="0.3"/>
    <circle cx="710" cy="885" r="1.4" opacity="0.3"/>
    <circle cx="1220" cy="895" r="1.6" fill="#FDE68A" opacity="0.32"/>
